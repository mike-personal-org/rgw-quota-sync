# rgw-quota-sync example config. RGW admin keys come from the RGW_ACCESS_KEY
# and RGW_SECRET_KEY environment variables, never from this file.
rgw:
  endpoint: https://rgw.example.org:8080   # Admin Ops API base URL (no path)
  uid_format: "{id}${id}"                  # rgw_keystone_implicit_tenants
  # verify: /etc/ssl/certs/site-ca.pem     # true (default), false, or a CA bundle

default:             # applied to projects whose quota is disabled or unlimited
  max_size: 10T      # bytes, or K/M/G/T/P suffix (binary, 1K = 1024); -1 = unlimited
  max_objects: -1    # -1 = unlimited

overrides:           # optional, keyed by Keystone project ID; enforced exactly
  # Quote IDs to be safe; unset fields fall back to `default`.
  "00000000000000000000000000000000": {max_size: 250T}
