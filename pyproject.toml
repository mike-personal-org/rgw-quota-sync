[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rgw-quota-sync"
version = "0.1.0"
description = "Give every Ceph RGW user created by Keystone its configured quota"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "requests",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
rgw-quota-sync = "rgw_quota_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]  # isort, pyupgrade, bugbear
